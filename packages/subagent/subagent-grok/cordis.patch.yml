- insert:
    - id: subagent-grok
      name: '@deepseek-ai/dsh-subagent-grok'
      config:
        logDirectory: !!js |
          (() => { if (!process.env.DSH_HOME) throw new Error('Set DSH_HOME before enabling native subagents'); return process.env.DSH_HOME + '/subagent-logs' })()
    - id: tool-subagent-grok
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: grok
        toolName: subagent_grok
        maxDepth: provider-managed
