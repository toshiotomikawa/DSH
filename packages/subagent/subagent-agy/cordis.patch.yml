- insert:
    - id: subagent-agy
      name: '@deepseek-ai/dsh-subagent-agy'
      config:
        logDirectory: !!js |
          (() => { if (!process.env.DSH_HOME) throw new Error('Set DSH_HOME before enabling native subagents'); return process.env.DSH_HOME + '/subagent-logs' })()
    - id: tool-subagent-agy
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: agy
        toolName: subagent_agy
        maxDepth: provider-managed
